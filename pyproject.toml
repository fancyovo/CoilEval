[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coil-eval"
version = "0.1.0"
description = "GPU evaluation of stellarator coils and local gradients"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Physics"]

[project.optional-dependencies]
test = ["pytest>=7", "build", "wheel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a compiled CUDA library and GPU"]
