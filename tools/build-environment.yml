name: coileval-build
channels:
  - nvidia/label/cuda-12.8.1
  - conda-forge
dependencies:
  - python=3.12
  - cuda-nvcc=12.8
  - cuda-cudart-dev
  - cuda-cccl
  - libcublas-dev
  - libcusolver-dev
  - gxx_linux-64=11
  - sysroot_linux-64=2.28
  - cmake
  - ninja
  - pip
  - pip:
      - scikit-build-core>=0.11,<1
      - build
      - auditwheel
      - patchelf
