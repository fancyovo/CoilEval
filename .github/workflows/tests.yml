name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy pytest build scikit-build-core
      - run: python -m pip install -e . --no-deps --config-settings=wheel.cmake=false
      - run: python -m pytest -q
      - run: python tools/check_layout.py
      - run: python -m build --sdist
  torch-operators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy scipy threadpoolctl pytest scikit-build-core
      - run: python -m pip install -e . --no-deps --config-settings=wheel.cmake=false
      - run: python -m pytest -q
