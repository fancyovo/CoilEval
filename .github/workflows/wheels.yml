name: Build Linux wheel
on: [workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: tools/build-environment.yml
          cache-environment: true
      - name: Build CUDA 12.8 multi-architecture wheel
        shell: bash -el {0}
        run: bash tools/build_linux_wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coil-eval-linux-cu128
          path: dist/*
